name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt pytest pyflakes
      - name: Check code for errors (undefined names, unused imports)
        run: pyflakes *.py tests/*.py
      - name: Run tests
        run: pytest -q
